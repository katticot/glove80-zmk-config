# Enable RGB Underglow driver subsystem
CONFIG_ZMK_RGB_UNDERGLOW=y

# Boot with underglow OFF (Base layer stays unlit)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Default startup effect: 0 = SOLID (steady, non-animated constant light)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Default brightness (0-100%)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=80

# Conserve battery: turn off automatically when idle or asleep
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_SLEEP=y

# Cut power rail (WS2812_CE) when RGB is OFF to eliminate standby power draw
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
