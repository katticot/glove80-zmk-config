# Enable RGB Underglow driver subsystem
CONFIG_ZMK_RGB_UNDERGLOW=y

# Boot with underglow OFF (Base layer stays unlit)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Gaming colour (static green) is set by the enter_gaming macro, not at boot

# Conserve battery: turn off automatically when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Cut power rail (WS2812_CE) when RGB is OFF to eliminate standby power draw
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# DEBUG ONLY: stream ZMK logs over the left half's USB serial port
CONFIG_ZMK_USB_LOGGING=y
